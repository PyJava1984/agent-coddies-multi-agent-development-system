# agent-coddies — credentials
# ---------------------------------------------------------------------------
# Copy to  config/credentials.yaml  and fill in. That file is gitignored.
#
#   cp config/credentials.example.yaml config/credentials.yaml
#
# Any value may be written as ${ENV_VAR} to pull it from the environment
# instead of storing it on disk — recommended for anything long-lived:
#
#   token: ${JIRA_API_TOKEN}
#
# A value may also be read from a file with  file:C:/path/to/secret.txt
# Never commit a filled-in credentials.yaml. Never paste one into a chat.
# ---------------------------------------------------------------------------

jira:
  # Cloud:  https://yourcompany.atlassian.net
  # Server/DC: https://jira.yourcompany.com
  base_url: https://yourcompany.atlassian.net
  # cloud | server
  deployment: cloud
  # Cloud → your Atlassian account email. Server with a PAT → leave blank.
  email: you@yourcompany.com
  # Cloud → API token from id.atlassian.com/manage-profile/security/api-tokens
  # Server/DC → personal access token
  token: ${JIRA_API_TOKEN}
  # Optional: verify TLS. Set to a CA bundle path for self-signed internal certs.
  verify_ssl: true

gitlab:
  base_url: https://gitlab.yourcompany.com
  # Personal access token with scopes: api, read_repository, write_repository
  token: ${GITLAB_TOKEN}
  # Numeric id, or the URL-encodable path: "group/subgroup/repo"
  project: group/subgroup/repo
  verify_ssl: true

# Optional — only needed when a ticket touches persisted data.
# The CLI is read-only: it refuses anything that is not a single SELECT.
# Point it at a DEV or LOCAL database. Never production.
database:
  enabled: false
  # postgres | mysql | oracle | sqlserver | sqlite
  dialect: postgres
  host: localhost
  port: 5432
  database: appdb
  # Oracle only, when connecting by service name:
  # service_name: ORCLPDB1
  user: readonly_user
  password: ${DB_PASSWORD}
  schema: public
  # Columns matching these patterns are masked in `db sample` output.
  redact_columns:
    - "*password*"
    - "*token*"
    - "*secret*"
    - "*email*"
    - "*phone*"
    - "*ssn*"
    - "*national_id*"

# Environments coddie-qa runs end-to-end tests against.
# Use seeded test accounts only — never a real user's credentials.
test_environments:
  local:
    base_url: http://localhost:3000
    username: test.user
    password: ${TEST_USER_PASSWORD}
  dev:
    base_url: https://dev.yourcompany.com
    username: test.user
    password: ${TEST_USER_PASSWORD}
  # Present so the config is explicit about it: never automate against prod.
  # prod: FORBIDDEN
